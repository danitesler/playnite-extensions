Name: Chakra UI Theme
Author: danitesler
ShortDescription: A fully dark desktop theme built on Chakra UI's dark tokens and teal color palette.
InstallerManifestUrl: https://raw.githubusercontent.com/danitesler/playnite-extensions/main/src/ChakraUiTheme/info/InstallerManifest.yaml
SourceUrl: https://github.com/danitesler/playnite-extensions/tree/main/src/ChakraUiTheme
Description: |
  Chakra UI Theme brings Chakra UI's dark mode to the Playnite desktop app: near-black surfaces, gray panels, and Chakra's teal as the accent.

  Buttons are borderless and filled like Chakra's subtle and solid variants, tabs use Chakra's underline style, and keyboard focus shows Chakra's 2px teal ring. Selected sidebar items, checked boxes, sliders, and the Play button pick up the teal palette.

  Inspired by Chakra UI; not affiliated with the Chakra UI project.
Tags: [Dark, Minimal, Desktop, Chakra UI]
