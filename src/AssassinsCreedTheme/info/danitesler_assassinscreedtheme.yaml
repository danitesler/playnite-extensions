Type: ThemeDesktop
Name: Assassin's Creed Theme
Author: danitesler
ShortDescription: A dark desktop theme modeled on the Assassin's Creed game menus, with a tab strip, gold accents and entry-style game screens.
InstallerManifestUrl: https://raw.githubusercontent.com/danitesler/playnite-extensions/main/src/AssassinsCreedTheme/info/InstallerManifest.yaml
SourceUrl: https://github.com/danitesler/playnite-extensions/tree/main/src/AssassinsCreedTheme
Description: |
  Assassin's Creed Theme gives Playnite the look of the games' menus: near-black charcoal surfaces, warm ivory text, one gold accent, hairline rules, and diamonds and corner brackets wherever something is current.

  The layout follows the menus. The sidebar is always a tab strip along the top, with each tab's icon and title in the heading serif and a gold underline with a diamond under the current one. Below it, a sub-bar holds the search field on the left and the view, sort, filter and notification buttons on the right. In the Details view the game list sits on the left and the game info screen fills the rest like an entry screen: the title in small caps over a gold divider, the action buttons, the cover in a frame with gold corner brackets, a small-caps property list and the description under its own heading. The Grid view has the same screen in a side panel, and selected covers get a gold frame and brackets.

  Controls follow the same language: glass buttons with a hairline edge and a solid gold default button, inset fields with a gold focus edge, diamond check boxes and radio buttons, a diamond slider thumb, hairline scroll bars and progress bars. The icons are original thin-line artwork drawn for this theme, and no game assets are included. It uses fonts that ship with Windows (Segoe UI Semilight and Palatino Linotype). The sidebar position setting is not used: the tab strip is always on top.

  Inspired by the Assassin's Creed games; not affiliated with Ubisoft.
Tags: [Dark, Desktop, Game menus, Gold, "Assassin's Creed"]
