AddonId: ExeIcon_28501CFD
Type: MetadataProvider
Name: ExeIcon
Author: danitesler
ShortDescription: Fills missing game icons from the game's own executable—works for Steam, Epic, and other store-launched games.
InstallerManifestUrl: https://raw.githubusercontent.com/danitesler/playnite-extensions/main/src/ExeIcon/info/InstallerManifest.yaml
SourceUrl: https://github.com/danitesler/playnite-extensions/tree/main/src/ExeIcon
Description: |
  Games launched through a store URL (Epic, Steam, EA, Ubisoft, and others) often import without an icon, and Playnite cannot pull one from the executable because the play action is not a file.

  ExeIcon is a metadata source for the Icon field. It finds the game's executable in its install folder, skipping installers, redistributables, crash handlers, and anti-cheat, and extracts the full icon with every size up to 256px.

  Pick ExeIcon as the Icon source in Playnite's Download metadata dialog (or as the default Icon source in metadata settings) and run it on the games that are missing icons. Installed games only; no internet access needed.
Tags: [Metadata, Icons, Offline, Epic, Steam]
