Type: ThemeDesktop
Name: Shadcn UI Theme
Author: danitesler
ShortDescription: A fully dark desktop theme built on shadcn/ui's zinc palette and component styles.
InstallerManifestUrl: https://raw.githubusercontent.com/danitesler/playnite-extensions/main/src/ShadcnUiTheme/info/InstallerManifest.yaml
SourceUrl: https://github.com/danitesler/playnite-extensions/tree/main/src/ShadcnUiTheme
Description: |
  Shadcn UI Theme brings the shadcn/ui look to the Playnite desktop app: near-black zinc surfaces, thin borders, rounded controls, and quiet monochrome accents.

  Buttons, inputs, selects, checkboxes, tabs, menus, tooltips, sliders, progress bars, and scrollbars follow shadcn/ui's components. The sidebar sits on its own surface like a shadcn dashboard, and cover tiles get a ring on hover and selection.

  Inspired by shadcn/ui; not affiliated with the shadcn/ui project.
Tags: [Dark, Minimal, Desktop, shadcn]
