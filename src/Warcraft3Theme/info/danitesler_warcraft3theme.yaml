ShortDescription: A dark desktop theme in the style of Warcraft III's interface: stone plates, bronze and gold trim, and a unit-info game screen.
InstallerManifestUrl: https://raw.githubusercontent.com/danitesler/playnite-extensions/main/src/Warcraft3Theme/info/InstallerManifest.yaml
SourceUrl: https://github.com/danitesler/playnite-extensions/tree/main/src/Warcraft3Theme
Description: |
  Warcraft III Theme recreates the look of Warcraft III's interface in the Playnite desktop app: blue-grey stone plates in bronze and gold trim, gold menu text, and Friz Quadrata type (when installed; Palatino or Georgia otherwise).

  The sidebar is the main menu, a column of stone plates. The top strip carries the menu plate, the search well and command-card buttons. Menus follow the F10 game menu, cover tiles sit in command-card frames with a green selection ring, and the game info screen is laid out like the unit info console: a framed portrait, the name in gold, and Game Details, Notes and Description panels with title strips.

  Frames are drawn in XAML and the icons are game-icons.net (CC BY 3.0) stand-ins; no Blizzard art is included. Fan work, not affiliated with Blizzard Entertainment.
Tags: [Dark, Desktop, Fantasy, Warcraft]
