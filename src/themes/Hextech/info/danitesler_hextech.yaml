Name: Hextech
Author: danitesler
ShortDescription: A near-black and gold theme with a left navigation rail, flat gold-edged buttons and a hextech-blue Play button. Inspired by the League of Legends client.
InstallerManifestUrl: https://raw.githubusercontent.com/danitesler/playnite-extensions/main/src/themes/Hextech/info/InstallerManifest.yaml
SourceUrl: https://github.com/danitesler/playnite-extensions/tree/main/src/themes/Hextech
Description: |
  Hextech gives Playnite the look of the League of Legends client: near-black blue surfaces, dark-gold one pixel edges that brighten on hover, cream headings and gold-tan text.

  Navigation is a slim icon rail on the left: a hexagon button (it opens Playnite's main menu), then one icon per view (Library, Statistics, plugin views) with a gold bar on the current one. A toolbar across the top holds search and the view controls. Buttons are flat grey with a gold edge, menus are near-black panels, sliders have a diamond handle, and the Play button is the client's blue "Hextech Magic" style, kept for actions on the game itself.

  The palette follows the one that circulates in community UI kits for the client and is not sampled from it. No Riot logos, icons, fonts or artwork are included; the hexagon mark is original. Inspired by the League of Legends client; not affiliated with or endorsed by Riot Games. League of Legends is a trademark of Riot Games, Inc.
