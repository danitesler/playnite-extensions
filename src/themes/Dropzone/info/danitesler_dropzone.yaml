Name: Dropzone
Author: danitesler
ShortDescription: A dark, minimal theme with a rounded navbar strip, a light pill for the current view, a yellow PLAY button and rounded covers. Inspired by the Fortnite lobby.
InstallerManifestUrl: https://raw.githubusercontent.com/danitesler/playnite-extensions/main/src/themes/Dropzone/info/InstallerManifest.yaml
SourceUrl: https://github.com/danitesler/playnite-extensions/tree/main/src/themes/Dropzone
Description: |
  After the Fortnite lobby: deep navy surfaces, a rounded navbar strip with heavy capital view tabs and a light pill for the current one, a sidebar rail with a slanted blue current tab, a yellow PLAY button, rounded covers with a focus ring, and a game page laid out like an island's details screen.

  Unofficial; not affiliated with Epic Games. Fortnite is a trademark of Epic Games, Inc. No game assets included.
Tags: [Dark, Desktop, Gaming]
