Name: Clutch
Author: danitesler
ShortDescription: A dark, minimal theme with a 64px navbar of uppercase view tabs, a GO play button and map-tile covers. Inspired by the Counter-Strike 2 main menu.
InstallerManifestUrl: https://raw.githubusercontent.com/danitesler/playnite-extensions/main/src/themes/Clutch/info/InstallerManifest.yaml
SourceUrl: https://github.com/danitesler/playnite-extensions/tree/main/src/themes/Clutch
Description: |
  Clutch gives Playnite the look of a tactical shooter's main menu (inspired by the Counter-Strike 2 menu): translucent black panels over the game's art, light grey text, and one pale blue for the selected tab and focus.

  The layout follows the menu. A 64px navbar runs across the top with a crosshair button (Playnite's main menu) and search at the left, the views as uppercase tabs split by thin rules in the middle, and filter and notifications at the right; an icon rail holds the library and statistics. The game page puts the name over the background art with a green GO button, then the description and one metadata pane on a black panel. Covers get the white edge of a selected map tile. Buttons, inputs, menus, tabs, sliders, tooltips and scroll bars are restyled to match, with Material Symbols icons.

  Colors and sizes come from the game's public Panorama style sheets; no logos, icons, fonts or images from the game are included. Unofficial; not affiliated with or endorsed by Valve Corporation. Counter-Strike is a trademark of Valve Corporation.
