<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="#FFFFFF">
  <!-- Ditherwake Watch-Compass Emblem (compound filled paths for path rasterizer & XAML StreamGeometry):
       Octagonal Memento Mortem pocket-watch bezel ring + top winding stem & bow +
       4 cardinal dial ticks + compass star & asymmetric watch hands. -->
  <!-- Winding bow ring & stem -->
  <path d="M23,9 A9,6.5 0 0,1 41,9 H37.8 A5.8,4 0 0,0 26.2,9 Z"/>
  <rect x="28.5" y="7.5" width="7" height="4.5" rx="1"/>
  <!-- Outer octagonal watch case with octagonal dial cutout -->
  <path fill-rule="evenodd" d="M21,12 H43 L52,21 V43 L43,52 H21 L12,43 V21 Z M23,16 L16,23 V41 L23,48 H41 L48,41 V23 L41,16 Z"/>
  <!-- 4 cardinal dial ticks inside watch face -->
  <rect x="30.5" y="17.5" width="3" height="3.5"/>
  <rect x="30.5" y="43" width="3" height="3.5"/>
  <rect x="17.5" y="30.5" width="3.5" height="3"/>
  <rect x="43" y="30.5" width="3.5" height="3"/>
  <!-- 4-point nautical compass star + watch hands pointing to X and II with center pinion hole -->
  <path fill-rule="evenodd" d="M32,21.5 L34.6,29.4 L42.5,32 L34.6,34.6 L32,42.5 L29.4,34.6 L21.5,32 L29.4,29.4 Z M32,29.5 A2.5,2.5 0 1,0 32,34.5 A2.5,2.5 0 1,0 32,29.5 Z"/>
  <!-- Watch hands to 10 o'clock and 2 o'clock -->
  <path d="M22.5,24.5 L24.5,22.5 L32,30 L30,32 Z"/>
  <path d="M40.5,23.5 L42.2,25.5 L33.5,32.5 L31.8,30.5 Z"/>
</svg>
