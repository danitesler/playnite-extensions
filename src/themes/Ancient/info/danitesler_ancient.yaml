Name: Ancient
Author: danitesler
ShortDescription: A dark desktop theme with a slate top bar, glowing uppercase tabs, bevelled grey buttons and a big green Play button. Inspired by the Dota 2 main menu.
InstallerManifestUrl: https://raw.githubusercontent.com/danitesler/playnite-extensions/main/src/themes/Ancient/info/InstallerManifest.yaml
SourceUrl: https://github.com/danitesler/playnite-extensions/tree/main/src/themes/Ancient
Description: |
  Ancient gives Playnite the look of the Dota 2 main menu (the dashboard): a near-black slate top bar, a black strip under it, bevelled grey buttons, black check boxes that fill pale teal when ticked, and a big green Play button, all on your games' own background art.

  Put Playnite's sidebar at the top (Settings > Appearance > Layout) and it becomes the dashboard's top bar: the home button at the left, then Library, Statistics and your add-on views as uppercase tabs in the title font, grey at rest, white on hover, white with a blue glow behind the current one. The top panel below it is the black secondary strip, with the view, sort and filter buttons at the left and a search box at the right. The game page puts the title large over the art with the green Play button under it and every detail in one slate side panel.

  Colors, sizes and control shapes come from the game's own interface stylesheets (Panorama CSS, read for values only). The game's fonts are used if installed (Radiance, Reaver), otherwise Segoe UI and a serif title font; no fonts are bundled. The icons and the add-on icon are original artwork, and no game assets are included.

  Inspired by the Dota 2 main menu; not affiliated with or endorsed by Valve Corporation. Dota and Dota 2 are trademarks of Valve Corporation.
