SourceUrl: https://github.com/danitesler/playnite-extensions/tree/main/src/themes/Backbeat
Description: |
  A loud comic-book theme inspired by the cel-shaded look of Hi-Fi RUSH: thick outlines, angled cards, halftone dots, sticker indicators and illustrated controls such as a guitar-pick slider. The Play button thumps on the beat when you hover it.

  Unofficial fan theme. Not affiliated with, endorsed by or sponsored by Tango Gameworks, Bethesda Softworks, ZeniMax Media or KRAFTON, Inc. Contains no game art, characters, logos or fonts.
