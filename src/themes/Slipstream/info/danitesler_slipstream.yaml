Description: |
  A light Playnite desktop theme inspired by the menus of Star Wars: Galactic Racer: a warm paper page, ink type and rules, vermilion pills for the selected tab and row, dark teal dialog pills, toggle switches, and blue, sage and mustard racing stripes. Unofficial and fan-made; not affiliated with, endorsed by or sponsored by Lucasfilm, Disney, or the game's developer or publisher. Contains no game art, logo or font.
