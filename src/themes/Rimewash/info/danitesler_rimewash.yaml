AddonId: Rimewash_642C84BA
Type: ThemeDesktop
Name: Rimewash
Author: Dani Tesler
ShortDescription: 'A frosted watercolour paper theme with torn snow plates, a dry-brush swipe and a golden chevron cursor, inspired by Child of Light (unofficial, not affiliated).'
InstallerManifestUrl: https://raw.githubusercontent.com/danitesler/playnite-extensions/main/src/themes/Rimewash/info/InstallerManifest.yaml
SourceUrl: https://github.com/danitesler/playnite-extensions/tree/main/src/themes/Rimewash
Description: |
  A light Playnite theme drawn like the menu screens of a painted fairy tale: a pale blue-grey watercolour wash, torn white snow plates on a soft shadow, slate slots and buttons, orange values and dotted pencil rules under serif titles. Whatever is selected gets a white dry-brush swipe and a golden chevron; Play draws the swipe across its slate plate and a teal wisp keeps the running game company.

  Inspired by the menus of Child of Light. Unofficial fan theme: not affiliated with or endorsed by the game's developer or publisher. No game art, logo or font is used.
Tags: [Light, Desktop]
