Type: ThemeDesktop
Name: Medallion
Author: danitesler
ShortDescription: A black, minimal theme with a brush-edged icon rail, uppercase DIN text and thin double frames. Inspired by The Witcher 3 main menu.
InstallerManifestUrl: https://raw.githubusercontent.com/danitesler/playnite-extensions/main/src/themes/Medallion/info/InstallerManifest.yaml
SourceUrl: https://github.com/danitesler/playnite-extensions/tree/main/src/themes/Medallion
Description: |
  After The Witcher 3: Wild Hunt main menu: a near-black icon rail with a rough brush edge on the left, uppercase DIN text, thin double frames with notched corners around the current item, brown hairlines and an amber wash on selected rows. Colors were sampled from the game's menus.

  Unofficial; not affiliated with CD PROJEKT RED. The Witcher is a trademark of CD PROJEKT S.A. No game assets included.
