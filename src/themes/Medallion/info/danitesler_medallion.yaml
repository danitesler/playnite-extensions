Description: |
  After The Witcher 3: Wild Hunt main menu: a near-black menu band with a rough brush edge on the left, centered uppercase menu items, thin double frames with notched corners around the current item, brown hairlines and an amber wash on selected rows. Colors were sampled from the game's menus.

