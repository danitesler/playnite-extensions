ShortDescription: A dark Western theme inspired by the Red Dead Redemption 2 menus: red painted rail, flat dark rows, red selection frame.
InstallerManifestUrl: https://raw.githubusercontent.com/danitesler/playnite-extensions/main/src/themes/Frontier/info/InstallerManifest.yaml
SourceUrl: https://github.com/danitesler/playnite-extensions/tree/main/src/themes/Frontier
Description: |
  Near-black pages, flat dark list rows, white type, a red painted rail on the left and a red frame around whatever is selected, inspired by the Red Dead Redemption 2 menus. Unofficial fan theme: no Rockstar assets, original artwork only. Install Hapna Slab Serif and RDR Lino for the closest type; otherwise it falls back to common slab fonts.
