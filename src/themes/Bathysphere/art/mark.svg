<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Bathysphere original brand mark:
    An Art Deco riveted circular bathysphere porthole ring with 4 cardinal rivet lugs,
    enclosing a streamlined lighthouse tower rising over stepped ocean chevrons
    with 3 radiating Art Deco beacon beams. Zero official BioShock trademarks or logos.
  -->
  <!-- Outer porthole ring with 4 cardinal lugs (solid compound path) -->
  <path fill="#FFFFFF" fill-rule="evenodd" d="
    M 32,2 L 36,6 A 26,26 0 0 1 58,28 L 62,32 L 58,36 A 26,26 0 0 1 36,58 L 32,62 L 28,58 A 26,26 0 0 1 6,36 L 2,32 L 6,28 A 26,26 0 0 1 28,6 Z
    M 32,10 A 22,22 0 1 0 32,54 A 22,22 0 1 0 32,10 Z
  " />
  <!-- 3 radiating Art Deco lighthouse beacon beams -->
  <path fill="#FFFFFF" d="
    M 32,12 L 34.4,21.5 L 29.6,21.5 Z
    M 17.5,17.5 L 27.6,23.2 L 24.8,26.0 Z
    M 46.5,17.5 L 39.2,26.0 L 36.4,23.2 Z
  " />
  <!-- Lighthouse lantern diamond + streamlined Deco tower -->
  <path fill="#FFFFFF" d="
    M 32,22.2 L 36.2,26.4 L 32,30.6 L 27.8,26.4 Z
    M 26.5,31.6 L 37.5,31.6 L 37.5,34.4 L 35.4,34.4 L 37.8,44.5 L 26.2,44.5 L 28.6,34.4 L 26.5,34.4 Z
  " />
  <!-- Stepped Art Deco ocean wave chevrons at base of porthole -->
  <path fill="#FFFFFF" d="
    M 14.5,43.2 L 23.5,43.2 L 25.0,46.4 L 16.5,46.4 Z
    M 49.5,43.2 L 40.5,43.2 L 39.0,46.4 L 47.5,46.4 Z
    M 19.5,48.0 L 44.5,48.0 L 41.2,51.2 L 22.8,51.2 Z
  " />
</svg>
