SourceUrl: https://github.com/danitesler/playnite-extensions/tree/main/src/themes/Clearwater
Description: |
  Clearwater is an unofficial Playnite desktop theme inspired by macOS 26 (Tahoe) Liquid Glass.
  It pairs floating frosted-glass navigation chrome, crisp specular top rims, continuous rounded corners,
  macOS traffic-light window controls, Apple System Blue accents, and 24 full-color 48x48 Liquid Glass
  squircle menu icons with calm, high-legibility library and game overview surfaces.
Tags: [Light, Desktop]
