<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="#FFFFFF">
  <!-- Original Cracked Mutagen / Aerosol Canister Emblem (no franchise logos) -->
  <!-- Canted canister body split by an organic jagged mutagen crack with 3 droplets -->
  <g transform="rotate(-14 50 50)">
    <!-- Top cap & spray collar -->
    <path d="M37,11 L63,11 L66,18 L34,18 Z" />
    <rect x="44" y="4" width="12" height="6" rx="1.5" />
    <!-- Upper half of glass canister cylinder above the jagged crack -->
    <path d="M30,21 L70,21 L70,44 L58,39 L49,49 L41,42 L30,48 Z" />
    <!-- Lower half of glass canister cylinder below the jagged crack -->
    <path d="M30,57 L41,51 L50,58 L59,48 L70,53 L70,79 L30,79 Z" />
    <!-- Bottom metal cap -->
    <path d="M33,82 L67,82 L64,90 L36,90 Z" />
  </g>
  <!-- Three rising mutagen splash droplets around the crack -->
  <path d="M80,26 C84,32 85,37 81,39 C77,41 74,37 76,32 Z" />
  <circle cx="87" cy="46" r="3.4" />
  <path d="M16,58 C20,54 24,55 24,59 C24,63 19,65 15,63 Z" />
  <circle cx="14" cy="46" r="2.8" />
</svg>
