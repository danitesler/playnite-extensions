AddonId: Foldcraft_275389AA
Type: ThemeDesktop
Name: Foldcraft
Author: Dani Tesler
ShortDescription: 'A Tearaway-inspired papercraft theme with gridded cutting-mat chrome, fibrous craft paper, accordion cardstock dossiers, and folded bookmark accents. An unofficial fan theme.'
InstallerManifestUrl: https://raw.githubusercontent.com/danitesler/playnite-extensions/main/src/themes/Foldcraft/info/InstallerManifest.yaml
SourceUrl: https://github.com/danitesler/playnite-extensions/tree/main/src/themes/Foldcraft
Description: |
  A Tearaway-inspired tactile papercraft desktop theme featuring self-healing cutting-mat rail chrome,
  torn-charcoal HUD toolbars, warm fibrous craft paper surfaces, accordion-folded ivory metadata dossiers,
  radial construction-paper bookmark selections, ochre-gold cutout Play triggers, split emerald/crimson
  folded toggles, and confetti-cobalt running sweeps. An unofficial community fan theme.
Tags: [Light, Desktop]
