Name: Biome
Author: danitesler
ShortDescription: A dark, minimal theme with blue menu panels over a night sky, outlined menu words that turn gold and pixel-art icons. Inspired by the Terraria main menu.
InstallerManifestUrl: https://raw.githubusercontent.com/danitesler/playnite-extensions/main/src/themes/Biome/info/InstallerManifest.yaml
SourceUrl: https://github.com/danitesler/playnite-extensions/tree/main/src/themes/Biome
Description: |
  After the Terraria main menu: translucent blue panels with black edges over a night sky, view switches as outlined menu words that turn gold, gold-edged hover states, inventory-slot covers and pixel-art icons. Values come from the game's interface code.

  Unofficial; not affiliated with Re-Logic. Terraria is a trademark of Re-Logic. No game assets included.
