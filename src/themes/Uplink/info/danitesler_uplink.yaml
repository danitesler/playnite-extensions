SourceUrl: https://github.com/danitesler/playnite-extensions/tree/main/src/themes/Uplink
Description: |
  Uplink gives Playnite the look of a sci-fi command console, inspired by the menus of StarCraft II: deep space navy, pale blue text, a lit blue accent, plates with cut corners and blue glows wherever something is current.

  The layout follows the game's menus. Put Playnite's sidebar at the top (Settings > Appearance > Layout) and it becomes the navigation bar: a home button boxed at the left, then Library, Statistics and your add-on views as uppercase tabs split by short dividers, the current one lit white over a blue glow with a bright line along its bottom edge. The top panel below it is the sub navigation strip, with search on the left and the view, sort, filter and notification buttons on the right. At the left or right the sidebar is an icon rail with the same glow and line.

  Controls follow the same language: dark blue buttons with cut corners and uppercase labels, a big lit blue Play button with a glow and a line of light along its bottom, octagon radio buttons, a cut-corner slider thumb, inset fields with a blue focus edge, and covers framed like portraits, with a blue glow creeping in from the edges and corner ticks on hover. Text colors come from the game's own UI style values. Headings use Eurostile Extended when it is installed and Bahnschrift otherwise; no fonts are bundled. The icons are original angular line artwork drawn for this theme, and no game assets are included.

  Inspired by the StarCraft II menus; not affiliated with or endorsed by Blizzard Entertainment. StarCraft is a trademark of Blizzard Entertainment.
