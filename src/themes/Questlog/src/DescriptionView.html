<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <!--
        The game description in the info panel of the game page (Views/DetailsViewGameOverview.xaml,
        Views/GridViewGameOverview.xaml). The panel is the dark tooltip backdrop, so the text is white
        (GameFontHighlight) and links are gold (GameFontNormal). The colors are literals: this file is not a
        template. Keep them in step with HIGHLIGHT_FONT_COLOR and NORMAL_FONT_COLOR in tokens.css.
        The font is the one Playnite passes (the user's Appearance font, so the description matches the rest of
        the window), then the client UI font and the closest serifs on a stock Windows machine.
    -->
    <style type="text/css">
        HTML,BODY
        {
            color: #FFFFFF;
            font-family: "{font_family}", "Friz Quadrata TT", "Constantia", "Palatino Linotype", "Georgia", "Segoe UI";
            font-size: {font_size}px;
            line-height: 1.45;
            margin: 0;
            padding: 0;
        }

        a {
            color: #FFD100;
            text-decoration: none;
        }

        img {
            max-width: 100%;
        }
    </style>
    <title>Game Description</title>
</head>
<body>
<div>
{text}
</div>
</body>
</html>
