Description: |
  An unofficial, fan-made Playnite desktop theme inspired by the menus of Metaphor: ReFantazio. Not affiliated with or endorsed by the game's developer or publisher.

  Hairline-ruled lists sit on a painted teal ground; the current game, menu row and tab sweep in on a ragged crimson dry brush with ink text. Headings are wide Didone small caps, the game's name rises behind its page as a giant cropped title, Play is a slanted white prompt plate that lands on a crimson splash, and More, Edit, close and cover buttons are ring prompts. Settings get a teal brush, a compass-ring title band and the menus' doubled hairlines; a running game turns quest yellow with a turning compass needle.

  Playfair Display SC and Gelasio are bundled (SIL Open Font License). No game art, logo or fonts are included.
