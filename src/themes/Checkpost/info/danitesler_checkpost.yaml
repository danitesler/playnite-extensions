Name: Checkpost
Author: zarte
ShortDescription: 'Unofficial Papers, Please-inspired theme: black void, olive report plates, a rubber-stamp Play button and a pink permit sheet for the details.'
InstallerManifestUrl: https://raw.githubusercontent.com/danitesler/playnite-extensions/main/src/themes/Checkpost/info/InstallerManifest.yaml
SourceUrl: https://github.com/danitesler/playnite-extensions/tree/main/src/themes/Checkpost
Description: |
  An unofficial, fan-made Playnite desktop theme inspired by the interface of Papers, Please. Not affiliated with or endorsed by the game's creator or publisher.

  Black report screens, flat olive plates and cream text. Play is a rubber stamp with a black knob that lifts on hover and slams on press, selected rows are lime paper slips with punched dots, covers are framed like a highlighted document, and menus, tabs and buttons use the game's dotted-underline words and DAY tabs. The game's details sit on a pink permit sheet with a scalloped edge, a taupe inner border, fields standing on underlines and round seal scores. A running game turns amber with three typewriter dots; the empty page is the Official Bulletin.

  Zilla Slab and Pixelify Sans are bundled (SIL Open Font License). No game art, logo, seal, document or font is included.
Tags: [Dark, Desktop, Gaming, Green]
