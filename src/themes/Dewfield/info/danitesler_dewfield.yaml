SourceUrl: https://github.com/danitesler/playnite-extensions/tree/main/src/themes/Dewfield
Description: |
  A Stardew Valley-inspired light farmstead desktop theme featuring walnut notice-board chrome,
  3-step cedar wood bevels, warm honey-parchment ledgers, inventory-slot grid tiles, rolled scroll
  headers, meadow-green harvest buttons, and a starwater-blue running indicator. An unofficial fan theme.
