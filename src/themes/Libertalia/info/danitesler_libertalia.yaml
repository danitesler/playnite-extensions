AddonId: Libertalia_7D7AF688
Type: ThemeDesktop
Name: Libertalia
Author: danitesler
ShortDescription: A dark, minimal theme of ivory text on black, a soft highlight behind the selected item and framed panels. Inspired by the Uncharted 4 menus.
InstallerManifestUrl: https://raw.githubusercontent.com/danitesler/playnite-extensions/main/src/themes/Libertalia/info/InstallerManifest.yaml
SourceUrl: https://github.com/danitesler/playnite-extensions/tree/main/src/themes/Libertalia
Description: |
  After the Uncharted 4 menus: the library floats on the darkened game art like the main menu list over its scene. Muted khaki text at rest, warm ivory for the selected item on a feathered highlight that fades out to the right, title case serif type, hairline rules, framed near-black panels and square save-slot buttons. Colors were sampled from screenshots of the game's menus.

  Unofficial; not affiliated with Naughty Dog or Sony Interactive Entertainment. Uncharted is a trademark of Sony Interactive Entertainment LLC. No game assets included.
Tags: [Dark, Desktop, Gaming]
