<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style type="text/css">
        html, body {
            color: {foreground};
            font-family: "{font_family}", Georgia, "Palatino Linotype", serif;
            font-size: {font_size}px;
            line-height: 1.56;
            margin: 0;
            padding: 0;
        }

        h1, h2, h3, h4 {
            font-family: Cinzel, "{font_family}", Georgia, serif;
            letter-spacing: 0.04em;
            margin: 14px 0 6px;
        }

        p {
            margin: 0 0 10px;
        }

        a {
            color: {link_foreground};
            text-decoration: none;
            border-bottom: 1px solid {link_foreground};
        }

        a:hover {
            text-decoration: underline;
        }

        hr {
            border: 0;
            border-top: 1px solid rgba(201, 168, 76, 0.35);
            margin: 14px 0;
        }

        blockquote {
            margin: 10px 0;
            padding: 6px 12px;
            border-left: 2px solid rgba(201, 168, 76, 0.55);
            opacity: 0.92;
        }

        img {
            max-width: 100%;
            height: auto;
        }
    </style>
    <title>Game Description</title>
</head>
<body>
<div>
{text}
</div>
</body>
</html>
