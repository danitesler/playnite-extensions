Type: ThemeDesktop
Name: Black Box
Author: Dani Tesler
ShortDescription: 'Unofficial NieR:Automata-inspired light Playnite desktop theme: warm khaki parchment, inverted charcoal-olive slabs, musical double-bars, diamond friezes, and terracotta rust alerts.'
InstallerManifestUrl: https://raw.githubusercontent.com/danitesler/playnite-extensions/main/src/themes/BlackBox/info/InstallerManifest.yaml
SourceUrl: https://github.com/danitesler/playnite-extensions/tree/main/src/themes/BlackBox
Description: |
  A light Playnite desktop theme inspired by the YoRHa operating system UI and HUD of NieR:Automata: warm khaki-parchment telemetry sheets, inverted charcoal-olive selection slabs with top/bottom tracking rails and mechanical pointer cursors, musical-staff double-bar headers, diamond-and-dot borders, Plug-in Chip capacity gauges, and terracotta rust primary actions. Unofficial and fan-made; not affiliated with, endorsed by, or sponsored by Square Enix or PlatinumGames. Contains no game art, logos, or proprietary fonts.
Tags: [Light, Desktop]
