Type: ThemeDesktop
Name: Battle.net
Author: danitesler
ShortDescription: A dark desktop theme in the style of the Battle.net app, with a game list, a game page and a big blue Play button.
InstallerManifestUrl: https://raw.githubusercontent.com/danitesler/playnite-extensions/main/src/themes/BattleNet/info/InstallerManifest.yaml
SourceUrl: https://github.com/danitesler/playnite-extensions/tree/main/src/themes/BattleNet
Description: |
  Battle.net brings the look of the Battle.net desktop app to Playnite: near-black blue-grey surfaces, white text and one bright Blizzard blue for Play, selection and focus.

  The layout follows the app. An icon rail on the left holds the logo button (it opens Playnite's main menu) and the view icons, and the top bar holds search and the view controls. The details view becomes the game list with a blue bar on the selected row, next to a game page: the game's background art runs full width and fades into the page, its name sits on the art, About and Game details cards follow, and a bottom bar carries the big blue Play button, the context action and an Options button with a gear. Buttons, inputs, menus, tabs, sliders and scroll bars are restyled to match, with Phosphor line icons.

  The colors are approximated by eye, not sampled from the client, and Blizzard's own logos and icons are not included. Inspired by Battle.net; not affiliated with or endorsed by Blizzard Entertainment.
Tags: [Dark, Desktop, Battle.net]
