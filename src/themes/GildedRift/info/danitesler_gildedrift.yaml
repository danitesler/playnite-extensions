AddonId: GildedRift_E2DB0856
Type: ThemeDesktop
Name: Gilded Rift
Author: Dani Tesler
ShortDescription: 'A dark navy and hextech gold theme: bevelled gold frames, a winged Play plate and a glowing crest, inspired by the League of Legends client (unofficial, not affiliated).'
InstallerManifestUrl: https://raw.githubusercontent.com/danitesler/playnite-extensions/main/src/themes/GildedRift/info/InstallerManifest.yaml
SourceUrl: https://github.com/danitesler/playnite-extensions/tree/main/src/themes/GildedRift
Description: |
  A Playnite theme drawn like a champion-select screen: blue-black navy panels closed by thin gold bevels, a roster of rows with a gold selection bar, champion-tile covers that take a gold ring, ability-tooltip menus and a winged Play plate that blooms with pale gold. The empty page is a glowing rift crystal.

  Inspired by the League of Legends client and Wild Rift. Unofficial fan theme: not affiliated with or endorsed by Riot Games. No game art, logo or font is used.
Tags: [Dark, Desktop]
