Description: |
  Unofficial Warhammer 40,000: Boltgun 2-inspired dark Playnite desktop theme: bolted gunmetal frames with brass corner miters and chain-link trim, phosphor-green CRT glass with scanlines and corner glass cracks, glowing mint-LED action plates, nailed aged-parchment metadata dossiers, acid-lime capsule toggles, I-beam sliders, and HUD armor-cobalt running/launching indicators. Not affiliated with, endorsed by or sponsored by Games Workshop, Focus Entertainment, Big Fan Games or Auroch Digital. Contains no game art, logos or proprietary fonts.
