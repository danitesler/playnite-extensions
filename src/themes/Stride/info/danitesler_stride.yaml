ShortDescription: "Unofficial stark light architectural glass theme inspired by Mirror's Edge (2008) and Mirror's Edge Catalyst — tempered ice-blue glass panels with velvety inner shadows, blazing red vertical pillar, glossy charcoal selection bars, and rooftop skyline."
