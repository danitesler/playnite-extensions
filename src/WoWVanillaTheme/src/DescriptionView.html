<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <!--
        The game description on the quest page (Views/DetailsViewGameOverview.xaml, Views/GridViewGameOverview.xaml).
        Playnite passes the foreground and link colors of its own theme in the placeholders below; this page sits on
        paper, so it sets its own inks: ItemTextFontNormal (0.18, 0.12, 0.06) for the text, a dark red for links.
        The font list is the client's UI font first, then the closest serifs on a stock Windows machine.
    -->
    <style type="text/css">
        HTML,BODY
        {
            color: #2E1F0F;
            font-family: "Friz Quadrata TT", "Constantia", "Palatino Linotype", "Georgia", "Segoe UI";
            font-size: {font_size}px;
            margin: 0;
            padding: 0;
        }

        a {
            color: #7A1A0A;
            text-decoration: none;
        }

        img {
            max-width: 100%;
        }
    </style>
    <title>Game Description</title>
</head>
<body>
<div>
{text}
</div>
</body>
</html>
