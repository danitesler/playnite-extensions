Type: ThemeDesktop
Name: Primer Theme
Author: danitesler
ShortDescription: A fully dark desktop theme built on GitHub's Primer design system.
InstallerManifestUrl: https://raw.githubusercontent.com/danitesler/playnite-extensions/main/src/PrimerTheme/info/InstallerManifest.yaml
SourceUrl: https://github.com/danitesler/playnite-extensions/tree/main/src/PrimerTheme
Description: |
  Primer Theme brings the look of GitHub's dark mode to the Playnite desktop app, using the Primer design system's own color tokens: a #0D1117 canvas, thin gray borders, blue for selection and focus, and green primary buttons.

  Buttons, inputs, and menus follow Primer's components, tabs use GitHub's underline navigation with the coral active bar, radio buttons get Primer's thick blue ring, and keyboard focus shows a 2px blue outline inside the control.

  Inspired by Primer; not affiliated with GitHub.
Tags: [Dark, Minimal, Desktop, Primer]
