name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/dependency-review-action@v4
        with:
          fail_on_severity: high
          deny-licenses: GPL-2.0, GPL-3.0
