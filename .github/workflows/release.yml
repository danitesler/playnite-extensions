name: Release

on:
  workflow_dispatch:
    inputs:
      extension:
        description: "Extension key from src/extensions.json"
        required: true
        default: "autogrid"
      configuration:
        description: "Build configuration"
        required: true
        default: "Release"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve extension metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          . ./scripts/extension-profiles.ps1
          $profile = Get-ExtensionProfile -Extension "${{ inputs.extension }}"
          $manifest = Get-ExtensionManifestInfo -Profile $profile
          $artifactDir = if ($profile.kind -eq "theme") { "themes/$($profile.slug)" } else { $profile.slug }
          "EXTENSION_SLUG=$($profile.slug)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EXTENSION_VERSION=$($manifest.Version)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EXTENSION_ARTIFACT_DIR=$artifactDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # package-release.ps1 finds an installed Toolbox or downloads the latest Playnite for it.
      - name: Verify, build, and package artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./scripts/build-artifacts.ps1 -Extension "${{ inputs.extension }}" -Configuration "${{ inputs.configuration }}" -VerifyInstaller

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.EXTENSION_SLUG }}-package-${{ env.EXTENSION_VERSION }}
          path: artifacts/releases/${{ env.EXTENSION_ARTIFACT_DIR }}/*
