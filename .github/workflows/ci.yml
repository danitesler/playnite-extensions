name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Validate and build every add-on
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $index = Get-Content -Raw src/extensions.json | ConvertFrom-Json
          foreach ($extension in $index.extensions) {
            Write-Host "== $($extension.key)"
            ./scripts/validate-extension.ps1 -Extension $extension.key -Mode Ci
            # Plugins compile with dotnet; themes render and run the static theme checks.
            ./scripts/build-plugin.ps1 -Extension $extension.key
          }
