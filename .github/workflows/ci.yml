name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  filter:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      core: ${{ steps.filter.outputs.core }}
      plugins: ${{ steps.filter.outputs.plugins }}
      themes: ${{ steps.filter.outputs.themes }}
      plugins_files: ${{ steps.filter.outputs.plugins_files }}
      themes_files: ${{ steps.filter.outputs.themes_files }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          list-files: json
          filters: |
            core:
              - 'scripts/**'
              - 'src/extensions.json'
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'package-lock.json'
            plugins:
              - 'src/*/**'
              - '!src/themes/**'
              - 'playnite-extensions.sln'
              - 'tests/**'
            themes:
              - 'src/themes/**'

  plugins:
    name: Plugins
    needs: filter
    if: github.event_name == 'push' || needs.filter.outputs.core == 'true' || needs.filter.outputs.plugins == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Validate and build plugins
        shell: pwsh
        env:
          CHANGED_FILES_JSON: ${{ needs.filter.outputs.plugins_files }}
          IS_CORE: ${{ needs.filter.outputs.core }}
        run: |
          $ErrorActionPreference = "Stop"
          $index = Get-Content -Raw src/extensions.json | ConvertFrom-Json
          $plugins = @($index.extensions | Where-Object { $_.kind -eq "plugin" })

          $runAll = "${{ github.event_name }}" -eq "push" -or $env:IS_CORE -eq "true"
          if (-not $runAll -and $env:CHANGED_FILES_JSON -and $env:CHANGED_FILES_JSON.Trim().Length -gt 2) {
            $changedFiles = $env:CHANGED_FILES_JSON | ConvertFrom-Json
            $targetPlugins = @($plugins | Where-Object {
              $dir = $_.dir
              @($changedFiles | Where-Object { $_ -like "$dir/*" }).Count -gt 0
            })
            if ($targetPlugins.Count -gt 0) {
              $plugins = $targetPlugins
            }
          }

          Write-Host "Validating and building $($plugins.Count) plugin(s)..."
          foreach ($extension in $plugins) {
            Write-Host "== $($extension.key)"
            ./scripts/validate-extension.ps1 -Extension $extension.key -Mode Ci
            ./scripts/build-plugin.ps1 -Extension $extension.key
          }

      - name: Run unit tests
        shell: pwsh
        run: |
          if (Test-Path tests/Tests.csproj) {
            dotnet test tests/Tests.csproj -c Release --logger "console;verbosity=normal"
          }

  themes:
    name: Themes
    needs: filter
    if: github.event_name == 'push' || needs.filter.outputs.core == 'true' || needs.filter.outputs.themes == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate and build themes
        shell: pwsh
        env:
          CHANGED_FILES_JSON: ${{ needs.filter.outputs.themes_files }}
          IS_CORE: ${{ needs.filter.outputs.core }}
        run: |
          $ErrorActionPreference = "Stop"
          $index = Get-Content -Raw src/extensions.json | ConvertFrom-Json
          $themes = @($index.extensions | Where-Object { $_.kind -eq "theme" })

          $runAll = "${{ github.event_name }}" -eq "push" -or $env:IS_CORE -eq "true"
          if (-not $runAll -and $env:CHANGED_FILES_JSON -and $env:CHANGED_FILES_JSON.Trim().Length -gt 2) {
            $changedFiles = $env:CHANGED_FILES_JSON | ConvertFrom-Json
            $targetThemes = @($themes | Where-Object {
              $dir = $_.dir
              @($changedFiles | Where-Object { $_ -like "$dir/*" }).Count -gt 0
            })
            if ($targetThemes.Count -gt 0) {
              $themes = $targetThemes
            }
          }

          Write-Host "Validating and building $($themes.Count) theme(s)..."
          foreach ($extension in $themes) {
            Write-Host "== $($extension.key)"
            ./scripts/validate-extension.ps1 -Extension $extension.key -Mode Ci
            ./scripts/build-theme.ps1 -Extension $extension.key
          }

  readmes:
    name: READMEs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Full history and tags: whether an add-on counts as released is decided by its `<key>-v<version>` tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Check generated READMEs and root README links
        run: node scripts/generate-readmes.mjs --check

  build:
    name: Build Summary
    needs: [filter, plugins, themes, readmes]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.plugins.result }}" = "failure" ] || [ "${{ needs.themes.result }}" = "failure" ] || [ "${{ needs.readmes.result }}" = "failure" ] || [ "${{ needs.filter.result }}" = "failure" ]; then
            echo "CI build failed"
            exit 1
          fi
          echo "All jobs succeeded or skipped as expected."
