name: Feature request
description: Suggest an improvement to a plugin or theme.
title: "[<add-on key>] short description"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Playnite is Windows-only. Builds and in-app testing require Windows;
        see CONTRIBUTING.md for what macOS/Linux contributors can still do.
  - type: input
    id: addon
    attributes:
      label: Add-on
      description: Key from src/extensions.json, or "new" for a new add-on idea.
      placeholder: "autogrid"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is awkward or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change, and what success looks like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Anything you already tried or ruled out.
