name: Bug report
description: Report a problem with a plugin or theme.
title: "[<add-on key>] short description"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Playnite is Windows-only. Builds and in-app testing require Windows;
        see CONTRIBUTING.md for what macOS/Linux contributors can still do.
  - type: input
    id: addon
    attributes:
      label: Add-on
      description: Key from src/extensions.json (e.g. autogrid, shade) and version/tag if released.
      placeholder: "shade, unreleased main"
    validations:
      required: true
  - type: input
    id: playnite
    attributes:
      label: Playnite version
      description: Desktop or Fullscreen, version number.
      placeholder: "Desktop 6.16.0 on Windows 11"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected vs what you saw.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Minimal steps, including theme/plugin settings if relevant.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: "%AppData%\\Playnite\\extensions.log" excerpt for plugins; screenshots for theme UI issues.
